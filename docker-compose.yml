services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pymeinsight}
      POSTGRES_USER: ${POSTGRES_USER:-pyme}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pyme}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pyme} -d ${POSTGRES_DB:-pymeinsight}"]
      interval: 5s
      timeout: 3s
      retries: 10

  core-api:
    build: ./services/core-api
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-pymeinsight}
      DB_USER: ${POSTGRES_USER:-pyme}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-pyme}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"

  web:
    build: ./web
    depends_on:
      - core-api
    ports:
      - "5173:80"

volumes:
  pgdata:
